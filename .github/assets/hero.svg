<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="CricketCommander — three AI agents react to every ball, live">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11151f"/>
      <stop offset="1" stop-color="#0a0d14"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="50%" cy="-10%" r="70%">
      <stop offset="0" stop-color="#3d5af1" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#3d5af1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="92%" cy="115%" r="55%">
      <stop offset="0" stop-color="#ff5d8f" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#ff5d8f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2d9cdb"/>
      <stop offset="0.5" stop-color="#f5c451"/>
      <stop offset="1" stop-color="#2fd07a"/>
    </linearGradient>
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#ffffff" opacity="0.018"/>
    </pattern>
    <style>
      .display { font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
      .mono    { font-family: "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace; }
      .sans    { font-family: "Helvetica Neue", Arial, sans-serif; }
      @keyframes blink { 0%,55% { opacity: 1 } 56%,100% { opacity: .25 } }
      @keyframes ping  { 0% { r: 5; opacity: .7 } 80%,100% { r: 13; opacity: 0 } }
      @keyframes draw  { to { stroke-dashoffset: 0 } }
      @keyframes rise  { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: translateY(0) } }
      .liveDot { animation: blink 1.4s steps(1,end) infinite; }
      .pingDot { animation: ping 1.6s ease-out infinite; }
      .line    { stroke-dasharray: 760; stroke-dashoffset: 760; animation: draw 2.4s ease-out .3s forwards; }
      .chip    { opacity: 0; animation: rise .6s ease-out forwards; }
      .chip2   { animation-delay: .25s; }
      .chip3   { animation-delay: .45s; }
    </style>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#glowBlue)"/>
  <rect width="1200" height="420" fill="url(#glowPink)"/>
  <rect width="1200" height="420" fill="url(#scan)"/>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="0" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>

  <!-- LIVE badge -->
  <g transform="translate(64,52)">
    <rect x="0" y="0" width="206" height="40" rx="20" fill="#0f1320" stroke="#ffffff" stroke-opacity="0.10"/>
    <circle class="pingDot" cx="24" cy="20" r="5" fill="#2fd07a"/>
    <circle class="liveDot" cx="24" cy="20" r="5" fill="#2fd07a"/>
    <text x="40" y="25" class="display" font-size="13" letter-spacing="3" fill="#2fd07a">LIVE</text>
    <line x1="84" y1="11" x2="84" y2="29" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="96" y="25" class="sans" font-size="13" fill="#c7cdd9">12,480 watching</text>
  </g>

  <!-- wordmark -->
  <g transform="translate(64,170)">
    <text class="display" font-size="74" letter-spacing="2" fill="#f5f7fa">CRICKET<tspan fill="#f5c451">COMMANDER</tspan></text>
    <text y="44" class="sans" font-size="17" letter-spacing="7" fill="#7f879a">THREE&#160;&#160;AI&#160;&#160;AGENTS&#160;&#160;&#183;&#160;&#160;ONE&#160;&#160;BALL&#160;&#160;&#183;&#160;&#160;EVERY&#160;&#160;DELIVERY</text>
  </g>

  <!-- agent lane chips -->
  <g transform="translate(64,300)">
    <g class="chip">
      <rect x="0" y="0" width="234" height="68" rx="14" fill="#0f1422" stroke="#2d9cdb" stroke-opacity="0.45"/>
      <rect x="14" y="14" width="4" height="40" rx="2" fill="#2d9cdb"/>
      <text x="30" y="30" class="display" font-size="14" letter-spacing="1.5" fill="#2d9cdb">STATS AGENT</text>
      <text x="30" y="50" class="sans" font-size="13" fill="#9aa2b2">Surprising nuggets</text>
    </g>
    <g class="chip chip2" transform="translate(252,0)">
      <rect x="0" y="0" width="234" height="68" rx="14" fill="#0f1422" stroke="#f5a04a" stroke-opacity="0.45"/>
      <rect x="14" y="14" width="4" height="40" rx="2" fill="#f5a04a"/>
      <text x="30" y="30" class="display" font-size="14" letter-spacing="1.5" fill="#f5a04a">BANTER AGENT</text>
      <text x="30" y="50" class="sans" font-size="13" fill="#9aa2b2">Hinglish hot takes</text>
    </g>
    <g class="chip chip3" transform="translate(504,0)">
      <rect x="0" y="0" width="234" height="68" rx="14" fill="#0f1422" stroke="#2fd07a" stroke-opacity="0.45"/>
      <rect x="14" y="14" width="4" height="40" rx="2" fill="#2fd07a"/>
      <text x="30" y="30" class="display" font-size="14" letter-spacing="1.5" fill="#2fd07a">PREDICTOR AGENT</text>
      <text x="30" y="50" class="sans" font-size="13" fill="#9aa2b2">Next-over outlook</text>
    </g>
  </g>

  <!-- scoreboard + sparkline panel -->
  <g transform="translate(820,150)">
    <rect x="0" y="0" width="316" height="218" rx="18" fill="#0e1320" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="0" y="0" width="316" height="218" rx="18" fill="url(#scan)"/>

    <text x="24" y="38" class="sans" font-size="11" letter-spacing="4" fill="#6f7789">RR &#160;vs&#160; MI</text>

    <text x="24" y="92" class="display" font-size="52" fill="#f5f7fa">187/6</text>
    <text x="24" y="116" class="sans" font-size="10" letter-spacing="3" fill="#6f7789">SCORE</text>

    <text x="196" y="74" class="display" font-size="30" fill="#f5c451">19.6</text>
    <text x="196" y="92" class="sans" font-size="10" letter-spacing="3" fill="#6f7789">OVERS</text>
    <text x="196" y="120" class="display" font-size="22" fill="#dfe3ea">9.85</text>
    <text x="196" y="136" class="sans" font-size="10" letter-spacing="3" fill="#6f7789">RUN RATE</text>

    <!-- win-prob sparkline -->
    <text x="24" y="156" class="sans" font-size="10" letter-spacing="3" fill="#6f7789">WIN PROBABILITY</text>
    <polyline class="line" fill="none" stroke="url(#spark)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
      points="24,196 60,188 96,192 132,176 168,182 204,160 240,168 276,150 292,140"/>
    <circle cx="292" cy="140" r="4.5" fill="#2fd07a"/>
  </g>

  <!-- footer tag -->
  <text x="600" y="404" text-anchor="middle" class="sans" font-size="11" letter-spacing="5" fill="#5b6275">BUILT ON ANTIGRAVITY &#160;&#183;&#160; APL MUMBAI 2026</text>
</svg>
